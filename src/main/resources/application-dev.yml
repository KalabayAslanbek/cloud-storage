spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:cloud}}
    username: ${POSTGRES_USER:cloud}
    password: ${POSTGRES_PASSWORD:cloud}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me}
  expMinutes: ${JWT_EXP_MINUTES:60}
  issuer: ${JWT_ISSUER:cloud-storage}

storage:
  root-dir: ${STORAGE_ROOT_DIR:./data/storage}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
