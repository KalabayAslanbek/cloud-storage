spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:cloud}
    username: ${POSTGRES_USER:cloud}
    password: ${POSTGRES_PASSWORD:cloud}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

jwt:
  secret: ${JWT_SECRET}
  expMinutes: ${JWT_EXP_MINUTES:60}
  issuer: ${JWT_ISSUER:cloud-storage}

storage:
  root-dir: ${STORAGE_ROOT_DIR:/data/storage}

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
